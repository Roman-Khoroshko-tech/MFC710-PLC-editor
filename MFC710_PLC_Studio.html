<script>globalThis.MANUAL_PAGES={"26":"# Сторінка 26\n\n                                                  Панель управління OP-11\n\n\n3.8. Зміна швидкості обертання двигуна (вихідної частоти) з панелі управління\n\n Швидкість обертання двигуна можна легко змінити з панелі управління,\n якщо виконано хоча б одну з таких умов:\n         джерелом завдання швидкості двигуна (задатчиком) є панель\n          управління - пар. 2.2 = „133 Keyb. ref.” «Клав.З»,\n         задатчик ПІД-регулятора встановлений на керування з панелі\n          управління - пар. 2.60 = „143 Keyb.P” (Клав.ПІД),\n         один із чотирьох задатчиків користувача активний (див.\n          розділ \"11.5 Панель Управління – визначення задатчиків\n          Споживача ” на стор. 61.\n Тоді в „базовому вигляді” за допомогою кнопок стрілок вгору/вниз „↑” „↓”\n можна змінювати швидкість обертання двигуна – рис. 3.5.                           Рис. 3.5 - Зміна вихідної частоти з панелі\n Повернення до «базового вигляду» здійснюється натисканням кнопки                                   управління\n ESC.\n\nУвага: В даний момент може бути активний лише один (або жоден) із вищезазначених задатчиків.\n\n3.9. Рівень доступу AL та блокування параметрів\nЯкщо ліворуч від параметра є символ замка, це означає, що він заблокований і змінити його значення неможливо.\nМожливі причини блокування редагування параметру:\n    деякі параметри можуть бути змінені, тільки якщо привід не працює (двигун зупинено),\n    актуальний рівень доступу не дозволяє змінювати цей параметр.\nTaблиця 3.4 - Параметри, що відповідають за блокування та рівні доступу.\n  Параметр                                                          Значення\n     4.1       Увімкнення блокування зміни параметрів. Після встановлення на „001 YES” змінити параметри буде неможливо -\n               крім „4.1 Par. block.” “Блокув. пар.» та „4.2 Level/CODE” «Рівень/Код»). Є два варіанти блокування, залежно від\n               того, чи встановлений код до рівня доступу 1 (AL1) на „0” (за замовчуванням) або на інше значення – див. пункт\n               „9.3.2 Блокування парамнтрів”.\n     4.2       Актуальний рівень доступу AL(читання), введення коду доступу (запис)\n     4.3       Зміна коду доступу AL для актуального рівня (показаного в пар. „4.2 Level/CODE” «Рівень/Код»)\n     4.4       Завантаження набору заводських параметрів у перетворювач\n     4.5       Сервісний параметр — не використовувати.\n               Блокування фізичного запису параметрів у EEPROM.\n               Встановлення цього параметра на „000 NO” призводить до того, що всі зміни, внесені до налаштувань\n               параметрів, зберігаються тільки в енергозалежній пам'яті та будуть втрачені після вимкнення живлення або\n               скидання приводу.\n\n3.9.1. Рівні доступу AL\n\nДля захисту параметрів приводу від втручання сторонніх осіб встановлено три рівні доступу AL (access level) до\nпараметрів:\n      AL0 (рівень 0 – найнижчий) – зміна параметрів неможлива. Параметр „4.1 Par. block.”\n«Блокув. пар.» повинен завжди мати значення „001 YES” і змінити його не можна.\n      AL1 (рівень доступу 1 – за замовчуванням) – можна редагувати параметри, крім\n       „4.4 Fact. set.” (Завод. пар.) та „4.5 En. EEPROM” «Ввімкни EEPROM».\n      AL2 (рівень 2 – найвищий) – призначений для завантаження заводських параметрів – див. пункт „3.7\n       Завантаження заводських параметрів”.\n\nКожному рівню доступу AL приписано свій номер (код), який є числом від \"0\" до \"9999\". Зміна рівня доступу AL\nздійснюється шляхом введення в пар. „4.2 Level/CODE” «Рівень/Код», який відповідає його кодовому номеру згідно\nтаблиці 3.5.\n\nЯкщо ввести код, який не приписано жодному рівню доступу AL, то після підтвердження введеного значення\nклавішею Enter рівень доступу AL не зміниться.\n                    Таблиця 3.5 - Значення кодів, приписані до рівня доступу AL за замовчуванням\n                              Рівень доступу AL                      Код(значення за замовчуванням)\n                                        1                                            0\n                                        2                                            1\nКористувач може призначити інший код для цього рівня доступу – пункт „3.9.3. Зміна кодів доступу”.\n\nПриклад зміни рівня доступу на AL2\n\nЗа замовчуванням рівню доступу AL2 приписаний код зі значенням ”1”. Це значення потрібно вписати до пар. „4.2\nLevel/CODE” «Рівень/Код» та підтвердити кнопкою Enter ”↵”. Екран буде виглядати як на рис.3.6.\n\n\n\n\n                                                          Векторний перетворювач типу MFC710. ТВЕРД ЕНЕРГО-ПЛЮС\n26\n","27":"# Сторінка 27\n\n                                                Панель управління OP-11\n\n\n\n Увага 1: Рівень доступу AL2 призначений для завантаження зумовлених\n заводських налаштувань – пункт „3.7 Завантаження заводських параметрів”.\n\n Увага 2: Після вимкнення живлення або скидання перетворювача (наприклад, при\n завантаженні заводських налаштувань) рівень доступу AL автоматично\n повернеться до рівня AL1.                                                                       Рис. 3.6 - Вид екрану при\n                                                                                                   рівні доступу РД = 2\n3.9.2. Блокування параметрів\n\nЄ два способи блокування редагування параметрів: тимчасове блокування та постійне.\n\nТимчасове блокування — без коду доступу\nТимчасове блокування полягає у зміні значення пар. „4.1 Par. block.” (Блокув. пар.) на „001 YES” без зміни рівня\nдоступу AL на \"0\". Це тимчасово заблокує (символ замка) всі параметри (крім „4.1 Par. block.” «Блокув. пар.» та „4.2\nLevel/CODE” «Рівень/Код») і зміна їх значення буде неможлива. Зміна ще раз значення пар. „4.1 Par. block.”\n«Блокув. пар.» на „000 NO” розблокує можливість редагування параметрів.\nПісля вимкнення живлення або скидання перетворювача параметри будуть автоматично розблоковані відповідно\nдо рівня доступу AL1.\n\nСлід звернути увагу на те, що таке тимчасове блокування можливе лише в ситуації, коли код до рівня доступу AL1\nвстановлений на ”0\". В іншому випадку зміна параметру „4.1 Par. block.” (Блокув. пар.) на „001 Yes” призведе до\nавтоматичної зміни рівня доступу AL на „0” – постійне блокування.\n\nПостійне блокування – з кодом доступу\nПостійне блокування полягає у зміні коду за замовчуванням (нуль), приписаного до рівня доступу AL1, на значення,\nвідмінне від нуля (див. пункт „3.9.3 Зміна кодів доступу”), а далі потрібно змінити значення пар. „4.1 Par. block.” «Блокув.\nпар.» на значення „001 Yes”. Це активує рівень доступу AL0 і надовго заблокує можливість змінювати всі параметри\n(символ замку) крім „4.1 Par. block.” «Блокув. пар.» та „4.2 Level/CODE” «Рівень/Код».\n\nПараметри будуть заблоковані також після вимкнення або скидання перетворювача.\n\nДля розблокування можливості зміни інших параметрів потрібно змінити код доступу на AL1 або AL2 шляхом\nвписування у параметрі „4.2 Level/CODE” «Рівень/Код» відповідного йому коду. Повернення до тимчасового блокування\nздійснюється зміною коду до рівня доступу AL1 на „0”.\n\nПриклад використання блокування доступу\n\nПісля ввімкнення живлення в перетворювачі за замовчуванням встановлено рівень доступу AL1 (пар.\n„4.2 Level/CODE” = „1”, а пар. „4.1 Par. block.” = „000 No”). Це дозволяє змінити всі параметри приводу, крім відновлення\nзаводських налаштувань (пар. 4.4 Fact. set.” «Завод. пар.») та зміни блокування фізичного запису параметрів в пам’ять\nEEPROM перетворювача (пар. „4.5 En.EEPROM” «Ввімкни EEPROM»).\n      Тимчасове              Для активування тимчасового блокування параметрів, пар.„4.1 Par. block.” «Блокув. пар.» потрібно\n      блокування             встановити на „001 Yes”.\n                             Для активування постійного блокування параметрів попередньо потрібно змінити приписаний рівню\n      Постійне               AL1 код на значення відмінне від „0”(наприклад „5”), a потім пар. „4.1 Par. block.” «Блокув. пар.»\n      блокування             встановити на „001 Yes”. Це призведе до зміни актуального рівня доступу на „0”, що буде видно в\n                             пар. „4.2 Level/CODE”.\nПісля увімкнення блокування при всіх заблокованих параметрах з'явиться символ замку.\n\nВимкнення постійного блокування доступу\n\nДля вимкнення постійного блокування доступу слід:\n      активувати рівень доступу AL1 → в пар. „4.2 Level/CODE” вписати код, приписаний AL1 під час активування\n       постійного блокування,\n      змінити код AL1 на „0” → в пар. „4.3 New CODE” «Новий КОД» ввести значення „0” (див. пункт „3.9.3. Зміна\n       кодів доступу”).\n\n3.9.3. Зміна кодів доступу\n\nЗміна кодів доступу до рівня AL1 та рівня AL2 відбувається за допомогою параметра „4.3 New CODE” «Новий\nКОД». Зміна стосуватиметься актуального рівня доступу AL.\nДля зміни коду потрібно:\n       перевірити, чи є рівень доступу AL, що висвічується у пар. „4.2 Level/CODE” «Рівень/Код» тим рівнем, якому\n        хочемо приписати новий код,\n       в пар. „4.3 New CODE” «Новий КОД» ввести новий код,\nРадимо записати новий код, щоб уникнути його втрати,\n       повторити введення нового коду в пар. „4.3 New CODE” «Новий КОД».\nЗ цього моменту перехід на рівень доступу, для якого було змінено код, відбуватиметься після введення цього нового\nкоду в пар. „4.2 Level/CODE” «Рівень/Код». Рівень доступу AL0 не має коду.\n\n\n Векторний перетворювач типу MFC710. ТВЕРД ЕНЕРГО-ПЛЮС\n                                                                                                                             27\n","61":"# Сторінка 61\n\n                                         Удосконалене програмування MFC710\n\n\n11.3. Модифікація стандартного управління\nЧастину параметрів у перетворювачі частоти MFC710 визначено як покажчики (рис. 11.2). Завдяки цьому можна\nзмінити стандартний спосіб управління перетворювачем частоти та за допомогою цих покажчиків підключати інші PCH.\nЦими РСН можуть бути, наприклад, виходи блоків системи управління PLC, що реалізує довільний алгоритм управління.\n\nНа рис. 11.2 наведено приклад модифікації стандартного управління. Параметр 2.2 є покажчиком, який за\nзамовчуванням встановлено в PCH „133 Keyb. ref.” \"Клав.З\", тобто Задатчик Панелі.\nЦе означає, що: Значення Задатчика А зніматиметься з панелі управління (рис. 11.2а). Після модифікації значення\nЗадатчика А може надходити, наприклад, з виходу блоку ном. 2 контролеру PLC (рис. b).\n\nВиходячи з умов безпеки параметри, які є покажчиками та стосуються роботи перетворювача частоти, мають обмеження\nдіапазону вибору PCH, який зводиться до кількох стандартно передбачених величин. Наприклад, для задатчиків A і B\nможна стандартно вибрати PCH, починаючи від ном. 133 до ном. 139 (відповідно це: задатчик панелі, задатчики\nаналогових входів 0, 1, 2, вихід ПІД-регулятора, мотопотенціометр та задатчик RS). Це гарантує, що недосвідчений\nкористувач не змінить цей параметр на невизначене значення. Якщо, однак, проектований варіант системи вимагає\nвідмінної від стандартної установки покажчика (а це може бути у випадку, коли для управління перетворювачем нам\nнеобхідно використовувати вбудовану систему управління PLC або систему управління групою насосів), то в цьому\nвипадку параметр 4.6 (“Повні покажчики”) встановити на значення „001 YES” «ТАК» (рис. 11.3).\n\n\n\n\n       Рис. 11.2   – Приклад модифікації стандартного управління               Рис. 11.3 – Розблокування покажчиків\n\nЧерговість дій при зміні стандартного управління:\n       1. Розблокувати можливість зміни параметрів (див. спосіб, наведений у розділі\n            „Рівень доступу AL і блокування параметрів” на стор. 27),\n       2. Параметр 4.6 встановити на значення „001 YES” «ТАК»,\n       3. Змінити заданий параметр перетворювача частоти, який є\n            покажчиком,\n       4. При необхідності заблокувати можливість зміни параметрів.\n\n11.4 Панель Управління – визначення власних величин, що висвічуються на дисплеї\nСеред параметрів групи 0 передбачено 4 параметри \"тільки для зчитування\", спосіб висвічування яких на дисплеї може\nвизначатися споживачем. Кожен із цих параметрів може включати значення довільної PCH. Визначаються також:\nодиниця виміру та кількість значень після коми. У таблиці наведено параметри, які визначають конфігурацію власних\nвеличин, що висвічуються на дисплеї.\nТаблиця 11.2 – Конфігурація власних величин, що висвічуються на дисплеї\n     Параметр, що визначається в          Параметри, які Значення\n групі 0                                  визначають\n                                          конфігурацію\n 0.54 (Usr1)                                                 Покажчик до PCH, який містить значення, що висвічується як\n                                          пар 4.60\n                                                             пар.0.54\n                                          пар 4.61           Одиниця виміру, що висвічується пар. 0.54 (див. таблицю)\n                                          пар 4.62           Кількість розрядів після коми пар. 0.54(0...3)\n 0.55 (Usr2)                                                 Покажчик до PCH, який містить значення, що висвічується як\n                                          пар 4.63\n                                                             пар.0.55\n                                          пар 4.64           Одиниця виміру, що висвічується пар. 0.55 (див. таблицю)\n                                          пар 4.65           Кількість розрядів після коми пар. 0.55 (0...3)\n 0.56 (Usr3)                                                 Покажчик до PCH, який містить значення, що висвічується як\n                                          пар 4.66\n                                                             пар.0.56\n                                          пар 4.67           Одиниця виміру, що висвічується пар. 0.56 (див. таблицю)\n                                          пар 4.68           Кількість розрядів після коми пар. 0.56 (0...3)\n                                                             Покажчик до PCH, який містить значення, що висвічується як\n                                          пар 4.69\n                                                             пар.0.57\n 0.57 (Usr4)\n                                          пар 4.70           Одиниця виміру, що висвічується пар. 0.57 (див. таблицю)\n                                          пар 4.71           Кількість розрядів після коми пар. 0.57 (0...3)\n\nУ зв'язку з тим, що пар. 0.54, 0.55, 0.56 та 0.57 належать до нульової групи параметрів, їх можна висвічувати на\nдисплеї панелі управління в базовому режимі або в режимі швидкого перегляду (див. розділ „.3.4 Зміна значень, що\nвисвічуються в базовому вигляді ” на стор. 26) і завдяки цьому отримати ефект, як це показано на рис. б.\n\n Векторний перетворювач типу MFC710. ТВЕРД ЕНЕРГО-ПЛЮС\n                                                                                                                      61\n","64":"# Сторінка 64\n\n                                               Cистема управління PLC\n\n\n12. Cистема управління PLC\nУ стандартному варіанті Перетворювач обладнаний вбудованою системою управління PLC, яка може служити для\nконтролю режимів роботи перетворювача або для управління певним технологічним процесом. Система управління\nPLC увімкнена, коли параметр 5.144 встановлено на значення „001 YES” «ТАК».\n\nОсновні характеристики системи управління РLС:\n          48 універсальних 3-вхідних блоки, з яких кожен може реалізувати одну з 43 логічних, арифметичних\n           функцій або функцій по часу, а також працювати в режимі лічильника,\n          блок секвенсора з можливістю програмування секвенції, що складається максимум із 8 станів – кожен з\n           індивідуально запрограмованим часом дії та можливістю зміни стану зовнішнім впливом,\n          2 мультиплексори 8-вхідних, які перемикають на вихід одну з восьми вхідних величин залежно від\n           вхідного сигналу управління,\n          5-точковий блок формування кривої X→Y, який може бути використаний, наприклад, як задатчик з\n           певною характеристикою,\n          24 програмовані Постійні Величини доступні так само як PCH (можуть бути використані як складові в\n           розрахунках),\n          час виконання програми PLC у повному обсязі у всіх випадках становить 10 мс.\n\nВиходи кожного блоку PLC є Характерними Точками, а входи – покажчиками і тому можна взаємно з'єднувати блоки\nміж собою та з параметрами перетворювача частоти, утворюючи при цьому структуру системи управління.\n\n12.1. Універсальні функціональні блоки\n\nЄ 48 функціональних блоків, які не мають чітко обмеженого призначення. З їхньою допомогою можна реалізувати різні\nалгоритми управління. Кожному з цих блоків можна приписати одну з 43 можливих логічних, арифметичних функцій,\nфункцій по часу або функцію лічильника (див. додаток B). Кожен із цих блоків має 3 входи, позначені A, B і C і є (залежно\nвід обраної функції) покажчиками чи постійними параметрами. Кожен блок має один вихід, який є Характеристичною\nТочкою. PCH блоку 1 має номер 256, PCH блоку 2 має номер 257 ... і т.д. до PCH блоку 48, який має номер 303 (рис. та\nДодаток А).\n\n\n\n\n                   Рис. 12.1 – Універсальний багатофункціональний блок. Входи A, B та C в залежності\n                               від функції блоку є покажчиками або звичайними параметрами.\n\nКожен із 48 Функціональних Блоків має 4 приписані постійні параметри в 6 групі параметрів, наприклад блок ном. 1 має\nпараметри:\n          пар 6.1 – функція блоку ном 1 (див. Додаток B)\n          пар 6.2 – вхід A блоку ном. 1\n          пар 6.3 – вхід B блоку ном. 1\n          пар 6.4 – вхід C блоку ном. 1\n\nВідповідно параметри 6.5 до 6.8 стосуються Блоку номер 2, параметри від 6.9 до 6.12 стосуються Блоку ном. 3 і\nт.д. аж до Блоку номер 48.\n\nУ процесі роботи PLC, функції, що визначаються Блоками, виконуються в черговості від 1 до 48 (завжди блок з нижчим\nномером виконується перед блоком з вищим номером).\n\nЧас циклу виконання програми PLC залежить від кількості блоків, які використані у програмі PLC, що визначається пар.\n5.145. Цей час виносить T=пар 5.145 x 0.2 мс. Заводський параметр встановлений на 50, що відповідає часу 10 мс.\n\nУВАГА 1. Блоки з номером, що перевищує значення, встановлене в пар. 5.145, не будуть виконуватися.\n\nУВАГА 2. Пристрій секвенсора, мультиплексори та Блок Формування Кривої потрібно помістити в одному з\nфункціональних блоків з метою їх активування.\n\n\n\n\n                                                      Векторний перетворювач типу MFC710. ТВЕРД ЕНЕРГО-ПЛЮС\n64\n","65":"# Сторінка 65\n\n                                                    Cистема управління PLC\n\n\n12.2. Пристрій секвенсора\n\nСеквенсор (рис. 12.2) дозволяє програмувати до 8 станів роботи перетворювача, що циклічно повторюються, з певними\nчасовими уставками тривалості окремих станів.\n\nВходи, позначені стрілками, є покажчиками – збирають дані з PCH, що визначається параметром на вході. Вхід LEN є\nзвичайним параметром. У разі визначення секвенсора як функціонального блоку, відповідні цьому блоку входи A, B, C\nне є активними. На виході секвенсора, який є відповідним PCH цього блоку, подається номер секвенції. Номер секвенції\nзнаходиться також у PCH.312.\n\n\n\n\n                                                                    Рис. 12.3 – Робота секвенсора без перешкод для LEN = 4 (a),\n                                                                            приклад використання входів NEXT i CLR (b)\n\n                Рис.12.2 – PLC - Секвенсор\n\n\n  Назва входу /\n                                                                      Значення\n     виходу\n                   Покажчик для PCH, що включає блок секвенсора. Коли ВКЛ.= 0, то в цьому випадку всі виходи пристрою\n      ВКЛ          набувають значення 0. Секвенсор встановлюється в стан готовності до початку СТАНУ 1 після розблокування\n                   цього входу.\n                   Кількість секвенцій. Кількість від 2 до 8. Дозволяє організувати кількість секвенцій. Після виконання останньої\n      LEN\n                   секвенції автоматично виконується перша (відбувається “зациклювання” секвенсора).\n      ВРЕМ1        Покажчики для PCH, які визначають тривалість окремих секвенцій. Діапазон часу 0.1 с...6553.5 с (дозвіл 0.1 с).\n    ... ВРЕМ8      Цими PCH можуть бути, наприклад, Постійні Значення (див. розділ 12.5).\n      NEXT         Примусове перемикання у наступний стан (вперед). Вхід спрацьовує при позитивному фронті сигналу.\n      PREV         Примусове перемикання у наступний стан (назад). Вхід спрацьовує при позитивному фронті сигналу.\n      CLR          Примусовий перехід у СТАН 1, коли CLR = Н (відрізняється від 0).\n      SET          Примусовий перехід у СТАН, який визначається входом SETVAL, коли SET = Н (пріоритет нижче, ніж CLR).\n                   СТАН у який перетворювач частоти переходить після подачі сигналу SET (діапазон 0...7, мають значення лише\n     SETVAL\n                   3 наймолодших біти).\n     СОСТ1         Виходи, які відповідають стану секвенсора на даний момент. В даний момент тільки один з виходів STAN1...\n    …СОСТ8         STAN8 може набувати значень, що відрізняються від нуля.\n     NRSEQ         Вихід – значення 0...7 відповідає номеру стану на даний момент часу – 1.\n\n\n12.3. Мультиплексори MUX1 та MUX2\n\nЦе два блоки, які реалізують функцію вибору 1 з 8. Залежно від стану входу вибору SELECT (може приймати значення\n0...7, важливими є лише 3 наймолодші біти) на виході Вих. Мультиплексора, що є PCH з номером 313 або 314\nпрописується значення з відповідного входу (від Вх.0 до Вх.7). Мультиплексор можна вимкнути (вхід Увімк.), тоді на\nвиході переписується значення, яке визначається параметром DVAL.\n\nЗа аналогією як і у випадку секвенсору величина параметрів (входів) є покажчиками. На рис. 12.4 перераховані\nпараметри, що стосуються роботи мультиплексорів.\n\n\n\n\n Векторний перетворювач типу MFC710. ТВЕРД ЕНЕРГО-ПЛЮС\n                                                                                                                                     65\n","66":"# Сторінка 66\n\n                                                   Cистема управління PLC\n\n\n\n\n                                           Рис. 12.4 – Мультиплексори MUX1 i MUX2\n\n\n12.4. Блок Формування Кривої\nСистема управління PLC включає в себе Блок Формування Кривої (БФК), який може служити, наприклад, для\nформування характеристики завдання швидкості – зміни характеристики з лінійної на певну ломану криву.\n\nБФК є функціональним перетворювачем довільної вхідної величини X у вихідну величину Y, значення якої залежить\nвід форми кривої, яка визначається за допомогою 5 точок (X, Y) (див. рис. 12.5 ). Ці точки визначено як параметри\nБФК. Якщо PLC увімкнено (параметр 5.144), то в цьому випадку БФК також включений в роботу. Параметр 5.100\nвстановлює пріоритет виконання БФК аналогічно як і пріоритет секвенсора та мультиплексорів (див. розділи 11.2 та\n11.3). Вхідна величина X вибирається параметром 5.101. Вихідна величина Y знаходиться в PCH.315.\n\n\n\n\n                       Рис. 12.5 – Орієнтовна характеристика, отримана за рахунок з'єднання 5 точок\n                                             (x1,y1),(x2,y2),(x3,y3),(x4,y4),(x5,y5).\n\n\nПараметр                          Опис                           Параметр                         Опис\n     5.101   Покажчик для входу (джерело значення входу X)         5.107    Y3 – параметр y точки 3. Діапазон -32000 ... 32000\n     5.102   X1 – параметр x точки 1. Діапазон -32000... 32000     5.108    X4 – параметр x точки 4. Діапазон -32000 ... 32000\n     5.103   Y1 – параметр y точки 1. Діапазон -32000... 32000     5.109    Y4 – параметр y точки 4. Діапазон -32000 ... 32000\n     5.104   X2 – параметр x точки 2. Діапазон -32000... 32000     5.110    X5 – параметр x точки 5. Діапазон -32000 ... 32000\n     5.105   Y2 – параметр y точки 2. Діапазон -32000... 32000     5.111    Y5 – параметр y точки 5. Діапазон -32000 ... 32000\n     5.106   X3 – параметр x точки 3. Діапазон -32000... 32000\n\n\nУВАГА: Повинна виконуватись умова X1 ≤ X2 ≤ X3 ≤ X4 ≤ X5.\n\n\n                                                          Векторний перетворювач типу MFC710. ТВЕРД ЕНЕРГО-ПЛЮС\n66\n","67":"# Сторінка 67\n\n                                               Cистема управління PLC\n\n\n12.5. Постійні величини\nУ разі, коли як вхід будь-якого блоку PLC необхідно встановити постійну величину, можна використовувати одну з 24\nпостійних величин, які віднесені до PCH з номерами від 320 до 343. Ці величини можна встановлювати в діапазоні від\n-32000 до 32000 за допомогою параметрів від 5.120 до 5.143.\n\nПриклад, коли потрібно використовувати постійну величину:\n\nНеобхідно виконати операцію Y=5*X, де X є вхідною величиною, а Y є вихідною величиною. Використовуючи\nуніверсальні блоки PLC, можемо виконати операцію (A*B/C) – це функція ном. 2 (див. Додаток B). Приймаємо A = X.\nB = 5 і C = 1, у результаті отримуємо функцію Y ( вихід універсального блоку) = X * 5 / 1\n\nЯк це зробити?\n    Параметром 5.120 встановлюємо значення Постійної ном. 1 на 5,\n    Параметром 5.121 встановлюємо значення Постійної ном. 2 на 1,\n    Параметр 6.1 (функція блоку 1) встановлюємо на значення 2 (функція 2, тобто A * B / C),\n    Параметр 6.2 (вхід A блоку 1) встановлюємо на джерело сигналу X, наприклад,\n                              Аналоговий Вхід 0 = PCH.134,\n    Параметр 6.3 (вхід B блоку 1) встановлюємо на Постійну Величину ном. 1 = PCH.320,\n    Параметр 6.4 (вхід C блоку 1) встановлюємо на Постійну Величину ном. 2 = PCH.321.\n\nУ зв'язку з тим, що входи B і C функції 2 є покажчиками, а не параметрами, їм не можна приписувати постійні\nзначення. Необхідно серед характеристичних точок вибрати Постійну ном. 1 (PCH.320) для входу B та Постійну\nном 2 (PCH.321) для входу C.\n\nПараметр 5.144 (Увімкнення PLC) встановлюємо на ТАК.\nЗ цього моменту PCH.256 (вихід блоку ном.1) є значенням, що відповідає результату операції\nX * 5, що у нашому випадку відповідає значенню аналогового входу 0 помноженому на 5. Тобто змінюється в межах від\n0 до 5000 (0.0 ... 500.0 %) (рис. 12.6).\n\n\n\n\n                   Рис. 12.6 – Структурна схема, що відображає приблизні Значення PCH.256 = PCH.134 * 5.\n\n\n12.6. Приклад використання PLC\nУ цьому пункті описано як за допомогою вбудованої системи PLC керувати такими величинами, як вихідна швидкість\nта час розгону двигуна.\n\nЗАВДАННЯ: Сформувати сигнал завдання на швидкість таким чином, щоб динамічна характеристика швидкості\nдвигуна під час розгону мала вигляд, показаний на рис. 12.7. На рис. 12.7. можна виділити три зони: I зона – повільний\nрозгін – (Динаміка 1), II зона – швидкість, що встановилася, а також III зона – швидкий розгін (Динаміка 2).\n\nПеретворювач частоти MFC710 дозволяє встановлювати 2 різних темпи розгону та гальмування - «Динаміка 1» та\n«Динаміка 2». Ці темпи визначаються параметрами 1.30, 1.31, 1.32, 1.33. Параметр 1.36 вирішує, яка динаміка діє\nв даний момент. Параметр 1.36 є покажчиком і тому його можна встановити таким чином, щоб про вибір динаміки\nвирішував один із блоків PLC.\n\nНа рис. показано, що після розгону електроприводу (з динамікою 1) до швидкості N1 необхідно зробити витримку часу\nT і потім розігнати електропривод (з динамікою 2) до швидкості N2. Необхідно модифікувати параметр 2.2 (Задатчик\nA) таким чином, щоб один з PLC блоків визначав приблизний рівень швидкості, до якої електропривод повинен\nрозігнатися (цей рівень відноситься до номінальної частоти двигуна).\n\nНа рис. 12.8 представлено структуру, яка реалізує поставлене завдання. Блок 1 є компаратором, який реагує на перше\nзначення швидкості. У наведеному випадку розгін у режимі динаміка 1 здійснюється до швидкості, яка становить     20.0\n% (ST1) номінальної швидкості. Сигнал, що інформує про досягнення першого значення швидкості, включає Блок 3.\nБлок 3 є лічильником, який рахує вниз від значення 5 (ST3) з тактуванням через кожну секунду (витримка часу становить\n5 с). Вихідний сигнал Блоку 3 управляє Блоком 4 та перемиканням типу динаміки (динаміка 1 або динаміка 2). Блок 4 є\nперемикачем, який, залежно від сигналу на вході, подає на задатчик A першу або другу величину швидкості (ST1/ST2).\nВеличини часу підтримки (ST3), першого (ST1) і другого (ST2) значення швидкості можна модифікувати, підключаючи\nу задане місце, наприклад на аналоговий вхід один із задатчиків користувача. Умовою нормального функціонування\nуправління у заданому прикладі є виконання умови: ST2 > ST1.\n\n\n Векторний перетворювач типу MFC710. ТВЕРД ЕНЕРГО-ПЛЮС\n                                                                                                                   67\n","73":"# Сторінка 73\n\n                                       Додаток A – Таблиця Характеристичних Точок\n\n\nДодаток A – Таблиця Характеристичних Точок\nУвага: У PCH, які необхідно інтерпретувати як логічні величини (0/1 або НІ/ТАК), використано скорочення Н як\nвизначення довільного значення, яке відрізняється від нуля (логічна 1). Для визначення значення “логічний 0”\nвикористано скорочення L.\n\n Ном. PCH          Назва PCH                                      Функція / значення / примітки\n   000        Sw.Off (Вимкни)         Значення завжди рівне L (логічний 0)\n   001        In.C1 (Вх.C1)           Стан цифрового входу ном.1; L = 0 В, Н = 24 В\n   002        In.C2 (Вх.C2)           Стан цифрового входу ном.2; L = 0 В, Н = 24 В\n   003        In.C3 (Вх.C3)           Стан цифрового входу ном.3; L = 0 В, Н = 24 В\n   004        In.C4 (Вх.C4)           Стан цифрового входу ном.4; L = 0 В, Н = 24 В\n   005        In.C5 (Вх.C5)           Стан цифрового входу ном.5; L = 0 В, Н = 24 В\n   006        In.C6 (Вх.C6)           Стан цифрового входу ном.6; L = 0 В, Н = globalThis.MANUAL_PAGES_I18N={"en":{"25":"3.8. Changing the rotational speed of the motor (output frequency) from the control panel\nThe motor speed can be easily changed from the control panel, provided that\nat least one of the following conditions is met:                                                               A         LO        LO\n     •     the source of the motor speed is the control panel                                              Keypad reference\n           (par. 2.2 = „133 Keyb. ref.”),\n     •     The PID controller reference-unit was set to be controlled from the\n           control panel (par. 2.60 = „143 Keyb.P”),                                                       [ 0020.0]Hz\n     •     one of the four user’s referencing-units is active (see chapter 11.5).\nThen, in the \"Basic view\", using the up / down „     ”  „   ” arrow keys you can\nchange the motor speed - fig. 3.5. You can return to the \"basic view\" by                                    Fig. 3.5 - Change of frequency\npressing the ESC key.                                                                                        output from the control panel\n\nNote: Only one (or none) of the above-mentioned referencing-unit can be\nactive at a time.\n\n3.9. PD access levels and parameters locks\n           If there is a padlock symbol on the left side of the parameter, it means that it is locked and it is impossible to\nchange its value. Possible causes of parameter editing lock:\n        •  some parameters can be changed only when the converter is not running (the motor is stopped),\n        •  the active access level does not allow the parameter to be modified.\n\nTable 3.3 - Parameters responsible for locks and access levels\n  Parameter                                                                 Description\n      4.1        Switching On the parameter change lock. When set to \"001 YES\", it will not be possible to change parameters (except\n                 for \"4.1 Par. block.\" and \"4.2 Level/CODE\"). The lock has two variants, depending on whether the code to access level\n                 1 (PD 1) is set to 0 (default value) or to a different number - see section 3.9.2 \"Parameter locks\".\n      4.2        Active PD access level (reading), entering the access code (writing).\n      4.3        Changing the access code for the active level (see par. 4.2).\n      4.4        Load a set of factory settings of the drive\n      4.5        Lock of physical parameter writing to EEPROM memory.\n                 Service parameter - do not use.\n                 Setting this parameter to \"000 NO\" causes that all changes made to parameter settings are saved only in the\n                 temporary memory and will be lost after power off or reset of the converter.\n\n3.9.1. PD access levels\n           In order to protect the converter settings against unauthorized changing, 3 levels of PD access to parameters\nare avaible:\n\n     •     PD 0 (level 0 - lowest) – parameters cannot be changed. Parameter \"4.1 Par. block.\" always has the value\n           \"001 YES\" and it cannot be changed.\n     •     PD 1 (level 1 - default) – it is possible to edit parameters (except for \"4.4 Fact. set.\" and \"4.5 En. EEPROM\").\n     •     PD 2 (level 2 - highest) – designed to load factory parameters – see chapter 3.7 “Restore factory settings”.\n\n           Each PD access level has its own number (code) assigned, which is a number from 0 to 9999. The change of\nthe PD access level is done indirectly by entering par. \"4.2 Level/CODE\" of the corresponding code number as shown in\ntable 3.4.\n           If a code not assigned to any of the PD access levels is entered, then after confirming the entered value with\nthe Enter key, the PD access level will not be changed.\n\n                      Table 3.4 - Default code values assigned to PD access levels\n                            PD access level                              Code (default)\n                                     1                                          0\n                                     2                                          1\n\nA user can assign a different code to a given access level - see section 3.9.3 “Change of access codes”.\n\n\nExample of changing the access level to PD 2                                                                     A          LO        LO\n                                                                                                            4 Disp, RS, user\nBy default, the access level PD 2 is assigned a code with the value 1. This                                 4.2 Level\nvalue should be entered in par. \"4.2 Level/CODE\" and confirmed with the Enter\nkey   „   ”. The screen changes to fig. 3.6.                                                                    PD = 2\n\nNote 1: The PD 2 access level is intended for loading predefined factory\nsettings - section 3.7 “Restore factory settings”.                                                          Fig. 3.6 - Screen view when access\n                                                                                                                        level PD = 2\nNote 2: After power off or reset of the converter (caused by e.g. loading of\nfactory settings) the PD access level will automatically return to the PD 1 level.\n\n\nFrequency converter MFC710 type with OP-11 control panel - TWERD ENERGO-PLUS                                                                       25","26":"3.9.2. Parameters locks\nThere are two ways to lock parameters editing: temporary and permanent.\n\nTemporary lock - without access code\n           Temporary lock consists in changing the value of par. \"4.1 Par. block.\" to \"001 YES\" without changing the PD\naccess   level   to   0.   This   will   temporarily   lock   (padlock   symbol)   all   parameters   (except   \"4.1   Par.   block.\"   and   \"4.2\nLevel/CODE\") and their values cannot be changed. Changing the value of par. \"4.1 Par. block.\" on \"000 NO\" will enable\nthe possibility of editing parameters.  After power off or reset of the inverter, parameters are automatically unlocked\naccording to PD 1 access level.\n\nNote: temporary locking is possible only when the code for the PD 1 access level is set to 0. Otherwise, changing the\nparameter \"4.1 Par. block.\" to \"001 YES\" will automatically change the PD access level to 0 - permanent lock.\n\nPermanent lock - with access code\n           The permanent lock of parameters consists in changing the default code (zero) assigned to the PD 1 access\nlevel to a value other than zero (see section 3.9.3. “Change of access codes”), and then changing the value of par. \"4.1\nPar. block.\" to \"001 YES\". This will activate the PD 0 access level and permanently lock the possibility of modifying all\nparameters (padlock symbol) except for \"4.1 Par. block\". and \"4.2 Level/CODE\".\n           The parameters will also remain locked after the drive is powered down or reset.\n           In order to unlock the possibility of changing other parameters, the access level should be changed to PD 1 or\nPD 2 by entering the corresponding code in the \"4.2 Level/CODE\" parameter. The return to the temporary lock is done\nby changing the code to the PD 1 access level to 0.\n\nAn example of using an access lock\nAfter power-up, the converter defaults to PD 1 access level (par. \"4.2 Level/CODE = 1\" and par. \"4.1 Par. block\" is set to\n\"000 NO\"). This enables the change of all parameters of the converter, except for restoring the factory settings (par.\n\"4.4 Fact. set.\") and changing the lock of physical parameter writing to the EEPROM of the converter (par. \"4.5 En.\nEEPROM\").\n\n      Temporary lock           To activate a temporary parameter lock, par. \"4.1 Par. block.\" should be set to \"001 YES\".\n      Permanent lock           In order to activate permanent lock of parameters, first change the code assigned to the PD 1\n                               level to a value other than zero (eg 5), and then par. \"4.1 Par. block.\" set to \"001 YES\". This\n                               will change the current access level to 0, which will be seen in par. \"4.2 Level/CODE\".\n\nAfter activating the lock, a padlock symbol will appear next to all locked parameters.\n\n\nDisabling permanent access lock\n           In order to disable permanent access lock:\n                •     activate access level PD1 → in par. \"4.2 Level/CODE\", enter the code that was assigned to PD1\n                      during the activation of the permanent lock,\n                •     change the PD1 code to \"0\" → in par. \"4.3 New CODE\", enter the value \"0\"\n                      (see section 3.9.3. “Change of access codes”).\n\n3.9.3. Change of access codes\n           The access codes to the PD 1 level and PD 2 level are changed by par. \"4.3 New CODE\". The change will\naffect the current PD access level.\nIn order to change the code:\n     •     check that the PD access level displayed in par. \"4.2 Level/CODE\" is the level to which we want to assign a\n           new code,\n     •     in par. \"4.3 New CODE\" enter a new code,\n           It is recommended to save the new code to prevent its loss,\n     •     repeat entering the new code in par. \"4.3 New CODE\".\nFrom now switching to the access level for which the code has been changed will take place after entering this new\ncode in par. \"4.2 Level/CODE\". Access level 0 has no code.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n26                                                  Frequency converter MFC710 type with OP-11 control panel - TWERD ENERGO-PLUS","58":"Section 11. Advanced programming of MFC710\n11. Advanced programming of MFC710\n\n          In order to use completely  the frequency converter possibilities and to seize art of its programming it is\nnecessary to familiarize with some concepts:\n\nCharacteristic point  (abbreviation: PCH) - any from accessible 512 values which characterize current state of the\nconverter’s operation, for example, there are characteristic points which are responsible for a state of digital input and\noutputs, values of referencing-unit’s signals and also points which are outputs of control unit PLC, etc. (see section\n11.1)\nPointer - parameter which decides about what among disposable 512 characteristic points (PCH) will be taken as input\nvalue in certain place of process (see sections 11.1 and 11.2). Many of the standard parameters determining operation\nof MFC710 are, in essence, pointers that makes possible, for example, to control the drive operation using built - in\ncontrol system PLC.\n\n11.1. Characteristic Points (PCH)\n\n          Each of 512 Characteristic Points is a 16-bit number and can accept a numerical value from range 0 up to\n65536 for unsigned numbers, or from -32768 up to 32767 for numbers with a sign. If this PCH is treated as digital value\n(logic 0 or 1) in this case value “logic 0” corresponds to value PCH = 0, and value “logic 1” corresponds each arbitrary\nvalue PCH ≠ 0. PCH are numbered from 0 to 511. Some of them are named in order to display their function on LCD or\nLED of control panel. Part of PCH remains  not used and is intended for future use. In table 11.1 general classification of\nPCH is presented. The detailed description of every PCH can be found in Appendix A “Characteristic Points”.\n\nTable 11.1 - General classification of PCH\nPCH  number                                   Value                              PCH number                           Value\n     0...127       Digital variables of process (e.g. Digital inputs)               384...447      PCH, accessible for record by means of\n                                                                                                   RS connection\n   128...255       Analog variables of process (e.g. Analog inputs)                 448...511      PCH, connected with optional module of\n   256...383      PCH, connected with units of internal control PLC                                expansions\n\n\n11.2.  PCH and the pointers – how does it\nwork\n\n          Pointers and PCH are strictly connected: Value\nof the pointer (in range 0...511) decides which PCH will\nbe picked - value of this PCH is output value (see fig.\n11.1).\n\n\n11.3. Modification of standard control                                     Fig. 11.1 –Principle of selecting PCH with  help of the pointer\n\n          Part of parameters in the frequency converter MFC710 are defined as pointers (fig. 11.2). Due to this it is\npossible to change a standard way of controlling the frequency converter by connecting others PCH by means of these\nparameters. This  РСН  can be, for example, outputs of control system PLC which implements any control algorithm.\nThere is an example in fig. 11.2.  The parameter 2.2 is the pointer which is set up in  PCH no.133 that is the Ref.-unit of\nPanel (Keyboard). It means: Value of the Referencing-unit  A  will be taken from the control panel (a). After modification\nvalue of the Referencing-unit  A  can be taken, for example, from an output of unit number 2 of control systems PLC (b).\n\n               A         LO       LO                         A         FU        LO                       A         LO        LO\n     a)   2 Refer. & control                        b)  2 Refer. & control                           2 Refer. & control\n          2.2 Ref.unit A                                2.2 Ref.unit A                               4.6 Full pointers\n          133 Keyb.ref.                                  257 BL.2                                    001 YES\n\n\n\n                     Fig. 11.2 – Example of standard control modification                              Fig. 11.3 – Unblocking pointers\n\nFor security reasons parameters which are pointers and concern operation of the frequency converter have restricted\nrange of selecting PCH. They are reduced to the several standard values. For example for referencing-unit A and B it is\npossible to choose standard PCH starting from no. 133 to 139 (respectively: referencing-unit of the panel, referencing-\nunit of analog inputs 0, 1, 2, an output of the PID controller, a motor-potentiometer and RS referencing-unit). It secures,\nthat the unexperienced user will not change this parameter to unspecified value. If however the designed application of\nsystem demands different from standard setting of the pointer   (e.g. in case when for control of the converter it is\nnecessary to use built-in PLC system or a control system of pumps group), in this case parameter 4.6 (“Full pointers”)\nshould be set up on value YES (fig. 11.3).\n\nOperation sequence at change of standard control:\n    1. Unblock possibility of parameters changing (see a way in section 3.9),\n    2. Set Parameter 4.6 on value \"001 YES\",\n    3. Change appropriate parameter of the frequency converter (the )\n    4. If it is necessary block possibility of parameters changing.\n\n58                                                 Frequency converter MFC710 type with OP-11 control panel - TWERD ENERGO-PLUS","61":"Section 12. PLC controller\n12. PLC controller\n\n           In standard variant the frequency converter is equipped with built-in PLC controller which can serve for the\ncontrol of converter's work or control of any process. PLC controller is switched on when the parameter 5.144 is set up\non value YES.\n           The basic characteristics of control system РLС:\n           • 48 universal 3-input units from which each can implement one of 43 logical, arithmetical or time-counting\n             functions,\n           • the sequencer unit with a possibility to program a sequence which will consist of maximum 8 states - each\n             with individually programmed time of operation and a possibility changing state by external signal,\n           • two 8-input multiplexers which connect to an output one of eight input values depending on control signal,\n           • 5-point formation unit of curve X→Y which can be used, for example, as the referencing-unit with the certain\n             characteristic,\n           • 24 programmed constants accessible also as PCH (can be used as factors in calculations),\n           • time of PLC program execution is less or equal to 10 ms.\n\n           Outputs of each PLC units are Characteristic Points, inputs are pointers and that’s why it is possible to connect\nunits among themselves and with parameters of the frequency converter, forming thus structure of a control system.\n\n12.1. Universal functional blocks\n\n           There are 48 functional units which don't have precisely limited purpose. Therefore with their help it is possible\nto implement many control algorithms. Each of these units can perform one of 43 possible logical, arithmetical, time-\ncounting sequencer, multiplexer,\ncurve   shaping   functions   (see               Input Ch.A\nappendix B). Each of these units\nhas   3  inputs   which  have   been                                      FUNCTIONAL                    Output\nmarked   A,   B   and   C   and   are            Input Ch.B                      UNIT                                         PCH #\n(depending     on     the    selected                                            # Ch                                       319 + Ch\nfunction)   pointers   or   constant             Input Ch.C                 (Ch = 1...48)\nparameters. Each unit has one\noutput which is a Characteristic\nPoint. OUT of unit 1 has number\n256,   OUT   unit   2   has   number       Fig. 12.1 -  Universal functional unit. Inputs A, B and C depending on function of the unit are\n257. and so on, up to OUT of                                                 pointers or usual parameters.\nunit 48 which has number 303 (fig. 12.1 and appendix A).\nEach of 48 Functional units has constantly assigned 4 parameters in 6 group of parameters, for example the Unit 1 has\nparameters:\n            Par. 6.1 - function of the unit 1 (see Appendix B)\n            Par. 6.2 - input A of the unit 1\n            Par. 6.3 - input B of the unit 1\n            Par. 6.4 - input C of the unit 1\nAccordingly, parameters 6.5 up to 6.8 concern the Unit 2, parameters from 6.9 to 6.12 concern the Unit 3 and so on up\nto the Unit 48.\n\n           During PLC operation functions determined by Units are carried out in sequence from 1 up to 48 (always the\nunit with the lowest number is carried out before the unit with the highest number).\n\n           The full operation time of PLC sequence depends on amount of blocks used in program, determined by par.\n5.145. This time is equal to T = par. 5.145 x 0.2ms. By default, parameter is set to 50 what limits time of execution to\n10  ms.\n\nNOTE 1. Units with numbers higher than par. 5.145 are not executed!\nNOTE 2. The sequencer device, Multiplexers and Curve shaping unit should be placed in one of the function\nblocks to activate them.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nFrequency converter MFC710 type with OP-11 control panel - TWERD ENERGO-PLUS                                                                     61","62":"Section 12. PLC controller\n12.2. Sequencer device\n\n           The sequencer (fig. 12.2) allows programming up to 8 cyclically repeating operation modes of the converter\nwith the determined times of duration of separate modes. Inputs marked out by arrows are pointers - they take the data\nfrom PCH determined by the specified parameter. Input LEN is an ordinary parameter.\n           In case of defining sequencer as functional unit corresponding inputs A, B and C aren't active. To output of\nsequencer (which is appropriate PCH of such unit) number of sequence is passed. Number of sequence can be also\nfound in PCH 312.\n\n\n     Parameters           SEQUENCER                   Outputs           a)            TIME 1     TIME 2        TIME3        TIME4      TIME1\n\n      p. 5.43         Time 1        State 1           PCH.304\n      p. 5.44         Time 2        State 2           PCH.305              STATE1\n      p. 5.45         Time 3        State 3           PCH.306              STATE2\n      p. 5.46         Time 4        State 4           PCH.307              STATE3\n      p. 5.47         Time 5        State 5           PCH.308              STATE4\n      p. 5.48         Time 6        State 6           PCH.309              NR SEQ\n      p. 5.49         Time 7        State 7           PCH.310\n      p. 5.50         Time 8        State 8           PCH.311                                                  TIME3\n                                                                        b)            TIME1      TIME2                                       TIME1\n                                                                                                                      TIME4\n      p. 5.42         LEN                                                  STATE1\n                                    NR SEQ            PCH.312              STATE2\n      p. 5.51         NEXT                                                 STATE3\n      p. 5.52         PREV                            PCH.255+x            STATE4\n      p. 5.53         CLR                                                  NR SEQ\n      p. 5.54         SET\n      p. 5.55         SETVAL                                               NEXT\n                                                                           CLR\n      p. 5.40         SW. ON\n                                                                           Fig. 12.3 - Undisturbed (without failures) operation of a sequencer\n                 Fig. 12.2 – PLC - Sequencer                                    for LEN = 4 (a), example of  input use NEXT and CLR (b)\n\n\n\n   Input/\n   output                                                                        Meaning\n   names\nSW. ON          The pointer to PCH switching on the unit of a sequencer. When SW. ON = 0 all outputs of the device are set on value 0.\n                The sequencer is ready  to the beginning of STATE 1 after unblocking this input\nLEN             Quantity of sequences. Range from 2 up to 8 allows to organize quantity of sequences. After execution of last sequence\n                first is automatically carried out (\"looping\").\nTIME  1         Pointers for PCH which define duration of separate sequences. A range of a time 0.1sec ... 6553.5 sec (interval 0.1 sec).\n... TIME 8      Constant Values (see section 12.5) can be, for example, this PCH.\nNEXT            Force switching into following state (forward). The input operates at down-up transition of a signal.\nPREV            Force switching into previous state (backward). The input operates at down-up transition of a signal..\nCLR             Force transition into STATE 1 when CLR = H (differs from 0).\nSET             Force transition into a STATE determined by input SETVAL when SET = H (the priority is lower, than CLR).\nSETVAL          STATE to which the frequency converter passes after supply of signal SET (a range 0...7,\n                there are only 3 youngest bits).\nSTATE 1         Outputs which correspond to current state of a sequencer. At the same time only one of outputs STAT1... STAT8 have\n...STATE 8      value other than zero.\nNR SEQ          An output - value 0...7. Number of a current state minus 1.\n\n\n12.3. Multiplexers MUX1 and MUX2\n\n           These are two units which implement\nthe selecting function “1 from 8”. Depending\non the input state of SELECT (values 0...7,\nonly   3   youngest   bits   are   important)   on   the\noutput of the multiplexer (PCH number 313 or\n314)   value from an appropriate input (from\nIn0 up to In7) is transferred. It is possible to\nswitch off the multiplexer (input Sw.on) then\ninput value of DVAL input is transferred to the\noutput. Parameter PRIOR can adopt a value\nfrom 1 (the most high priority) up to 48 (see\nthe   description   of   a   sequencer   operation   -                                 Fig. 12.4 - Multiplexers MUX1 and MUX2\nsection 12.2).\n\n           As in sequencer most parameters (inputs) are pointers. They are presented in fig. 12.4.\n\n\n\n62                                                      Frequency converter MFC710 type with OP-11 control panel - TWERD ENERGO-PLUS","63":"Section 12. PLC controller\n12.4. Curve shaping unit\n\n           PLC     controller     contain     Curve                                           Y\nShaping   Unit   (CSU)   which   can   serve,   for                                      y4\nexample, for formation of the characteristic of\nthe    speed    referencing     -   changing    the                                                                            y = f(x)\ncharacteristic   from   linear   to   determined\nbroken curve. CSU is the functional converter\nof   any   input   value   X   into   output   value   Y,\nwhich depends on the form of a curve which\nis defined with help of 5 points (X, Y) (see fig.                                        y2   y3\n12.5).   These   points   are   determined   as\nparameters of CSU. Input value X is chosen\nby   parameter   5.101.   Output   value   Y   is   in             x1                                                                     x5      X\nPCH.315.                                                                             x2                x3          x4\n\n\n                                                                                              y1\n\n                                                                                         y5\n\n\n\n\n\n\n                                                                        Fig. 12.5 -  E characteristic received due to joint of 5 points\n                                                                                 (x1, y1), (x2, y2), (x3, y3), (x4, y4), (x5, y5).\n\n\n\n Parameter                            Description                           Parameter                             Description\n    5.101          The pointer for an input (a source of value of the          5.107           Y3 - parameter y points 3. range-32000...32000\n                   X-input)\n    5.102          X1 - parameter x points 1. range-32000...32000              5.108           X4 - parameter x points 4. range-32000...32000\n    5.103          Y1 - parameter y points 1. range-32000...32000              5.109           Y4 - parameter y points 4. range-32000...32000\n    5.104          X2 - parameter x points 2. range-32000...32000              5.110           X5 - parameter x points 5. range-32000...32000\n    5.105          Y2 - parameter y points 2. range-32000...32000              5.111           Y5 - parameter y points 5. range-32000...32000\n    5.106          X3 - parameter x points 3. range-32000...32000\n\nCAUTION: conditions X1 ≤ X2 ≤ X3 ≤ X4 ≤ X5 should be satisfied.\n\n12.5. Constant values\n\n           In cases, when we want to determine a constant value as an input of any PLC block, we can use one of 24\nconstant values accessible as PCH with number from 320 to 343. These values can be set in range from -32000 to\n32000 by means of parameters 5.120 do 5.143.\n\nExample when there is a necessity to use a constant.\n\nIt is necessary to execute operation Y = 5 * X where X is an input value and Y is output value. Using universal units\nPLC, we can execute operation (A * B / C) This is function number 2 (see. Appendix B). We assume A = X, B = 5 and\nalso C = 1, in result we have function Y (an output of the universal unit) = X * 5 / 1\n\nHow shall we do it?\nWith parameter 5.120 we set value of Constant 1 to 5,\n    –   parameter 5.120 sets up value of the Constant number 1 on 5,\n    –   parameter 5.121 sets up value of the Constant number 2 on 1,\n    –   parameter 6.1 (function of the unit 1) is se które parametry można zmieniać tylko wówczas, gdy przemiennik nie pracuje (silnik jest zatrzymany),\n        •  aktualny poziom dostępu nie pozwala na modyfikację danego parametru.\n\nTabela 3.4 - Parametry odpowiedzialne za blokady i poziomy dostępu.\n  Parametr                                                                 Znaczenie\n      4.1        Włączenie blokady zmiany parametrów. Po ustawieniu na „001 TAK” niemożliwa będzie zmiana parametrów (poza\n                 „4.1 Blokada par.” i „4.2 Poziom/KOD”). Blokada ma dwa warianty w zależności od tego czy kod do poziomu dostępu 1\n                 (PD 1) jest ustawiony na 0 (wartość domyślna) czy na inną liczbę – patrz punkt 3.9.2 „Blokady parametrów” na str. 26.\n      4.2        Aktualny poziom dostępu PD (odczyt), wprowadzanie kodu dostępu (zapis).\n      4.3        Zmiana kodu dostępu dla aktualnego poziomu (widocznego w par. 4.2).\n      4.4        Ładowanie zestawu ustawień fabrycznych przemiennika\n      4.5        Blokada fizycznego zapisu parametrów do EEPROM.\n                 Parametr serwisowy - nie używać.\n                 Ustawienie tego parametru na „000 NIE” powoduje, że wszystkie dokonane zmiany nastaw parametrów są\n                 zapisywane tylko w pamięci ulotnej i zostaną utracone po wyłączeniu zasilania lub resecie przemiennika.\n\n3.9.1. Poziomy dostępu PD\n          W celu ochrony ustawień przemiennika przed ingerencją niepowołanych osób zastosowano 3 poziomy dostępu\nPD do parametrów:\n\n     •    PD 0 (poziom 0 - najniższy) – nie jest możliwa zmiana parametrów. Parametr „4.1 Blokada par.” ma zawsze\n          wartość „001 TAK” i nie jest możliwa jego zmiana.\n     •    PD 1 (poziom 1 - domyślny) – możliwa jest edycja parametrów (poza „4.4 Para. fabr.”\n          i „4.5 Wlacz EEPROM”).\n     •    PD 2 (poziom 2 - najwyższy) – przeznaczony do załadowania parametrów fabrycznych – patrz punkt „3.7.\n          Wgrywanie nastaw fabrycznych”.\n\n          Każdy poziom dostępu PD ma przypisany swój numer (kod), który jest liczbą z zakresu od 0 do 9999. Zmianę\npoziomu dostępu PD dokonuje się pośrednio, poprzez wpisanie w par. „4.2 Poziom/KOD” odpowiadającego mu numeru\nkodu zgodnie z tabelą 3.5.\n          Jeśli zostanie wpisany kod nie przypisany do któregoś z poziomów dostępu PD, to po zatwierdzeniu wpisanej\nwartości klawiszem Enter nie nastąpi zmiana poziomu dostępu PD.\n\n                     Tabela 3.5 - Domyślne wartości kodów przypisane do poziomów dostępu PD\n                         Poziom dostępu PD                       Kod (wartość domyślna)\n                                    1                                         0\n                                    2                                         1\n\nUżytkownik   ma   możliwość   przypisania  innego   kodu   do   danego   poziomu   dostępu   –   punkt   „3.9.3.   Zmiana   kodów\ndostępu”.\n\nPrzykład zmiany poziomu dostępu na PD 2\nDomyślnie poziomowi dostępu PD 2 przypisany jest kod o wartości 1. Wartość tę należy wpisać par. „4.2 Poziom/KOD” i\nzatwierdzić klawiszem Enter         „   ”. Ekran przyjmie wygląd jak na rys. 3.6.\n\n\n\n\n\n\n\nPrzemiennik częstotliwości typu MFC710 z panelem OP-11 – TWERD ENERGO-PLUS                                                                     25","26":"Rozdział 3: Panel sterujący OP-11\nUwaga 1: Poziom dostępu PD 2 jest przeznaczony do wgrywania                                              A         LO       LO\npredefiniowanych nastaw fabrycznych – punkt „3.7. Wgrywanie nastaw                                  4 Wysw., RS, uzyt.\nfabrycznych”.                                                                                       4.2 Poziom/KOD\nUwaga 2: Po wyłączeniu zasilania bądź resecie przemiennika (spowodowanego\nnp. wgraniem nastaw fabrycznych) poziom dostępu PD automatycznie powróci                                 PD = 2\ndo poziomu PD 1.\n\n3.9.2. Blokady parametrów                                                                          Rys. 3.6 - Widok ekranu gdy  poziom\nIstnieją dwa sposoby na zablokowanie edycji parametrów: blokada tymczasowa                                    dostępu PD = 2\ni trwała.\n\nBlokada tymczasowa – bez kodu dostępu\n          Blokada tymczasowa polega na zmianie wartości par. „4.1 Blokada par.” na „001 TAK” bez zmiany poziomu\ndostępu PD na 0. Spowoduje to tymczasowe zablokowanie (symbol kłódki) wszystkich parametrów (poza „4.1 Blokada\npar.” i „4.2 Poziom/KOD”) i nie będzie możliwa zmiana ich wartości. Ponowna zmiana wartości par. „4.1 Blokada par.”\nna „000 NIE” odblokuje możliwość edycji parametrów.  Po wyłączeniu zasilania lub resecie przemiennika parametry\nzostaną automatycznie odblokowane zgodnie z poziomem dostępu PD 1.\n          Należy zauważyć, że blokada tymczasowa jest możliwa jedynie w sytuacji, gdy kod do poziomu dostępu PD 1\njest ustawiony na 0. W przeciwnym razie zmiana parametru „4.1 Blokada par.” na „001 TAK” spowoduje automatyczną\nzmianę poziomu dostępu PD na 0 – blokada trwała.\n\nBlokada trwała – z kodem dostępu\n          Blokada trwała polega na zmianie domyślnego kodu (zero) przypisanego do poziomu dostępu PD 1 na wartość\nróżną od zera (patrz punkt „3.9.3. Zmiana kodów dostępu”), a następnie na zmianie wartości par. „4.1 Blokada par.” na\nwartość  „001 TAK”. Spowoduje  to aktywację  poziomu  dostępu  PD 0 i trwałe  zablokowanie  możliwość  modyfikacji\nwszystkich parametrów (symbol kłódki) poza „4.1 Blokada par.” i „4.2 Poziom/KOD”.\n          Parametry pozostaną zablokowane także po wyłączeniu zasilania lub resecie przemiennika.\n          W celu odblokowania możliwości zmiany pozostałych parametrów należy zmienić poziom dostępu na PD 1 lub\nPD 2 poprzez wpisanie w parametrze „4.2 Poziom/KOD” odpowiadającego mu kodu. Powrotu do blokady tymczasowej\ndokonuje się poprzez zmianę kod do poziomu dostępu PD 1 na 0.\n\nPrzykład zastosowania blokady dostępu\n          Po włączeniu zasilania przemiennik domyślnie ma ustawiony poziom dostępu PD 1 (par. „4.2 Poziom/KOD = 1”\na   par.   „4.1   Blokada   par.”   ustawiony   jest   na   wartość   „000 NIE”).   Umożliwia   to   zmianę   wszystkich   parametrów\nprzemiennika poza przywróceniem nastaw fabrycznych (par. „4.4 Para. fabr.”) i zmianą blokady fizycznego zapisu\nparametrów do pamięci EEPROM przemiennika (par. „4.5 Wlacz EEPROM”).\n\n      Blokada                W celu aktywacji tymczasowej blokady parametrów, par. „4.1 Blokada par.” należy ustawić na\n      tymczasowa             „001 TAK”.\n      Blokada trwała         W celu aktywacji trwałej blokady parametrów uprzednio należy zmienić kod przypisany do\n                             poziomu PD 1 na wartość różną od zera (np. 5) a następnie par. „4.1 Blokada par.” ustawić na\n                             „001 TAK”. Spowoduje to zmianę aktualnego poziomu dostępu na 0, co będzie widoczne\n                             w par. „4.2 Poziom/KOD”.\n\nPo włączeniu blokady przy wszystkich zablokowanych parametrach pojawi się symbol kłódki.\n\nWyłączenie trwałej blokady dostępu\n          W celu wyłączenia trwałej blokady dostępu należy:\n               •    uaktywnić poziom dostępu PD1 → w par. „4.2 Poziom/KOD” wpisać kod, który został przypisany do\n                    PD1 podczas aktywacji blokady stałej,\n               •    zmienić kod PD1 na „0” → w par. „4.3 Nowy kod” wpisać wartość „0” (patrz punkt „3.9.3. Zmiana\n                    kodów dostępu”).\n\n3.9.3. Zmiana kodów dostępu\n          Zmiana kodów dostępu do poziomu PD 1 i poziomu PD 2 odbywa się za pomocą parametru „4.3 Nowy KOD”.\nZmiana będzie dotyczyć aktualnego poziomu dostępu PD.\nW celu zmiany kodu należy:\n     •    sprawdzić czy poziom dostępu PD wyświetlany w par. „4.2 Poziom/KOD” jest tym poziomem dla którego\n          chcemy przypisać nowy kod,\n     •    w par. „4.3 Nowy KOD” wpisać nowy kod,\n          Nowy kod zaleca się zapisać, aby zapobiec jego utracie,\n     •    powtórzyć wpisanie nowego kodu w par. „4.3 Nowy KOD”.\nOd tej chwili przejście do poziomu dostępu dla którego kod został zmieniony będzie się odbywało po wpisaniu tego\nnowego kodu w par. „4.2 Poziom/KOD”. Poziomu dostępu 0 nie posiada kodu.\n\n\n\n\n\n\n\n\n26                                               Przemiennik częstotliwości typu MFC710 z panelem OP-11 – TWERD ENERGO-PLUS","55":"Rozdział 11:  Zaawansowane programowanie MFC710\n11.3. Modyfikacja sterowania standardowego\n\n          Część  parametrów w przemienniku  MFC710 zdefiniowano jako  wskaźniki (rys. 11.2). Dzięki temu można\nzmienić standardowy sposób sterowania przemiennikiem podłączając poprzez te parametry inne PCH mogą być to np.\nwyjścia bloków sterownika PLC realizującego dowolny algorytm sterowania.\n          Na rys. 11.2 zaprezentowano przykład modyfikacji sterowania standardowego. Parametr 2.2 jest wskaźnikiem,\nktóry domyślnie ustawiony jest na PCH nr „133 Klaw.Z” czyli Zadajnik Panelu. Znaczy to: Wartość Zadajnika A będzie\nbrana z panelu sterującego (rys. 11.2a). Po modyfikacji wartość Zadajnika A może pochodzić np. z wyjścia bloku nr 2\nsterownika PLC (rys. 11.2b).\n          Ze   względów   bezpieczeństwa   parametry   będące   wskaźnikami   i   dotyczące   pracy   przemiennika   posiadają\nograniczenie   zakresu   wyboru   PCH   zawężające   wybór   do   kilku   przewidzianych   standardowo   wielkości,   np.   dla\nzadajników A i B standardowo wybierać można PCH począwszy od nr 133 do nr 139                                (odpowiednio są to: zadajnik\npanelu, zadajniki wejść analogowych 0, 1, 2, wyjście regulatora PID, motopotencjometr i zadajnik RS). Gwarantuje to,\nże niedoświadczony użytkownik nie przestawi tego parametru na nieokreśloną wartość. Jeżeli jednak projektowana\naplikacja wymaga innego niż standardowe ustawienia wskaźnika (a jest tak, gdy do sterowania przemiennikiem chcemy\nwykorzystywać   wewnętrzny   sterownik   PLC   lub   sterownik   zespołu   pomp),   wówczas   należy   parametr   4.6   (“Pełne\nwskaźniki”) ustawić na wartość TAK (rys. 11.3).\nKolejność czynności przy zmianie standardowego sterowania:\n        1.  Odblokować możliwość zmiany parametrów w sposób podany w rozdziale „3.9. Poziomy dostępu PD i\n            blokady parametrów” na str. 25,\n        2.  Parametr 4.6 ustawić na “001 TAK”,\n        3.  Zmienić żądany parametr przemiennika będący wskaźnikiem,\n        4.  Ewentualnie zablokować możliwość zmiany parametrów.\n\n   a)       A          LO       LO               b)       A         FU        LO                       A         LO        LO\n       2 Zadaj. i ster.                              2 Zadaj. i ster.                             4 Wysw., RS, uzyt.\n       2.2 Zadajnik A                                2.2 Zadajnik A                               4.6 Pelne Wsk.\n        133 Klaw.Z                                    257 BL.2                                    001 TAK\n\n\n                                                                                                      Rys. 11.3 – Odblokowanie\n              Rys. 11.2 – Przykład modyfikacji sterowania standardowego                                       wskaźników\n\n\n11.4. Panel Sterowania - definiowanie własnych wielkości wyświetlanych\n          Wśród parametrów grupy 0 przewidziano 4 parametry “tylko do odczytu”, których sposób wyświetlania może\nbyć definiowany przez użytkownika. Każdy z tych parametrów może zawierać wartość dowolnego PCH, definiowalne są\nteż: jednostka wyświetlana i ilość miejsc dziesiętnych. W tabeli 11.2 zestawiono parametry konfigurujące.\n\nTabela 11.2 – Konfiguracja własnych wielkości wyświetlanych\n Definiowany par. w grupie 0         Parametry konfigurujące                                        Znaczenie\n                                    par. 4.60                       Wskaźnik do PCH, który zawiera wartość wyświetlaną jako par. 0.54\n           0.54 (Usr1)              par. 4.61                       Wyświetlana jednostka par. 0.54 (patrz tabela 11.3)\n  od funkcji\n           par. 6.3 – wejście B bloku nr 1                                                        bloku wskaźnikami lub zwykłymi parametrami.\n           par. 6.4 – wejście C bloku nr 1\nOdpowiednio parametry 6.5 do 6.8 dotyczą Bloku nr 2, parametry 6.9 do 6.12 dotyczą Bloku nr 3 itd. Aż do Bloku nr 48.\n\n           W trakcie pracy PLC funkcje określone przez Bloki wykonywane są w kolejności od 1 do 48 (zawsze blok o\nniższym numerze jest wykonywany przed blokiem o numerze wyższym).\n\n           Czas cyklu wykonywania programu PLC jest zależny od ilości bloków wykorzystanych w programie PLC,\nokreślonych par. 5.145. Czas ten wynosi T= par. 5.145 x 0.2 ms. Fabrycznie parametr ustawiony jest na 50, co daje\nczas 10ms.\nUWAGA 1: Bloki o numerze wyższym niż ustawiona wartość w par. 5.145 nie będą wykonywane.\nUWAGA 2: Układ sekwensera, multipleksery i Blok Kształtowania Krzywej należy umieścić w jednym z bloków\nfunkcyjnych w celu aktywacji ich działania.\n\n12.2. Układ sekwensera\n           Sekwenser (rys. 12.2) umożliwia zaprogramowanie do 8 cyklicznie powtarzających się stanów pracy układu\nz określonymi czasami trwania poszczególnych stanów.\n           Wejścia oznaczone strzałkami są wskaźnikami – pobierają dane z określonego podanym parametrem PCH.\nWejście LEN jest zwykłym parametrem. W przypadku zdefiniowania sekwensera jako bloku funkcyjnego odpowiadające\ntemu blokowi  wejścia  A, B, C nie  są  aktywne.  Na wyjście  sekwensera  będące  odpowiednim  PCH danego  bloku\npodawany jest numer sekwencji. Numer sekwencji znajduje się również w PCH.312.\n\n\n                  Parametry sterująceSEKWENSER       Wyjścia OUT         a)        CZAS1   CZAS2     CZAS3     CZAS4  CZAS1\n\n                    p. 5.43     CZAS 1CZAS 1STAN 1       PCH.304\n                    p. 5.44     CZAS 2     STAN 2        PCH.305           STAN1\n                    p. 5.45     CZAS 3     STAN 3        PCH.306           STAN2\n                    p. 5.46     CZAS 4     ST ekwenser się “zapętla”).\nCZAS1 ... CZAS8       Wskaźniki do PCH określających czasy trwania poszczególnych sekwencji. Zakres czasów 0.1s ... 6553.5s\n                      (rozdzielczość 0.1s). Tymi PCH mogą być np. Wielkości Stałe (patrz rozdział 12.5).\n       NEXT           Wymuszenie przełączenia do następnego stanu (do przodu). Wejście czułe na dodatnie zbocze.\n       PREV           Wymuszenie przełączenia do poprzedniego stanu (do tyłu). Wejście czułe na dodatnie zbocze.\n        CLR           Wymuszenie przejścia do STANU 1 gdy CLR = H (różne od zera).\n        SET           Wymuszenie przejścia do STANU określonego przez wejście SETVAL gdy SET = H (priorytet niższy niż CLR).\n     SETVAL           STAN do którego układ przejdzie po sygnale SET (zakres 0...7, ważne tylko 3 najmłodsze bity).\nSTAN1 ... STAN8       Wyjście odpowiadające numerowi aktualnie trwającego stanu sekwensera. W danej chwili tylko jedno z wyjść\n                      STAN1 ... STAN8 może przyjmować wartość różną od zera.\n     NR SEQ           Wyjście – wartość 0...7 odpowiada numerowi aktualnie trwającego stanu – 1.\n\n\n\n\nPrzemiennik częstotliwości typu MFC710 z panelem OP-11 – TWERD ENERGO-PLUS                                                                           57","58":"Rozdział 12:  Sterownik PLC\n12.3. Multipleksery MUX1 i MUX2\n\n           Są   to   dwa   bloki   realizujące   funkcję\n                                                                                MUX1                                     MUX2\nwyboru   1   z   8.   W   zależności   od   stanu   wejścia\nwyboru SELECT (może przyjmować ono wartości                         p. 5.60     WŁĄCZ                         p. 5.80    WŁĄCZ\n0...7,   ważne   są   tylko   3   najmłodsze   bity)   na\n                                                                    p. 5.62     DVAL                          p. 5.82    DVAL\nwyjściu   OUT   multipleksera   będącym   PCH   o                   p. 5.63     SELECT         W przypadkach, gdy jako wejście dowolnego bloku PLC chcemy ustawić wielkość stałą, możemy wówczas\nużyć jednej z 24 wielkości stałych dostępnych jako PCH o numerach od 320 do 343. Wielkości te możemy ustawiać w\nzakresie wartości od -32000 do 32000 za pomocą parametrów od 5.120 do 5.143.\n\nPrzykład, gdy potrzebne jest użycie wielkości stałej:\nChcemy wykonać operację Y = 5 * X, gdzie X jest wielkością wejściową, Y jest wielkością wyjściową. Korzystając z\nbloków uniwersalnych PLC umiemy wykonać operację (A * B / C) – jest to funkcja nr 2 (patrz Załącznik B). Przyjmujemy\nA = X. B = 5 oraz C = 1. Otrzymujemy w efekcie funkcję Y (wyjście bloku uniwersalnego) = X * 5 / 1\nJak to zrobić ?\nParametrem 5.120 ustawiamy wartość Stałej nr 1 na 5,\n    –  Parametrem 5.121 ustawiamy wartość Stałej nr 2 na 1,\n    –  Parametr 6.1 (funkcja bloku 1) ustawiamy na wartość 2 (funkcja 2, czyli A * B / C),\n    –  Parametr 6.2 (wejście A bloku 1) ustawiamy na źródło sygnału X np. Wejście Analogowe 0 = PCH.134),\n    –  Parametr 6.3 (wejście B bloku 1) ustawiamy na Wielkość Stałą nr 1 = PCH.320,\n    –  Parametr 6.4 (wejście C bloku 1) ustawiamy na Wielkość Stałą nr 2 = PCH.321.\n\nPonieważ wejścia B i C funkcji 2 są wskaźnikami a nie                         PCH.134 (We.A0)           ABLOK 1 funkcja 2\nparametrami,   nie   można   im   po   prostu   przypisać   stałej                                            A * B / C\nwartości.   Należy   spośród   punktów   charakterystycznych                   PCH.320 (Stała 1)        B                            PCH.256 (BL. 1)\nwybrać Stałą nr 1 (PCH.320) dla wejścia B i Stałą nr 2\n(PCH.321) dla wejścia C.                                                       PCH.321 (Stała 2)        C\nParametr 5.144 (Włączenie PLC) ustawiamy na TAK.\nOd tej chwili wyjście OUT bloku nr 1 będące PCH.256 jest                       Rys. 12.6 – Struktura zrealizowana w powyższym przykładzie.\nwartością  odpowiadającą  wynikowi  operacji  X * 5, co w czekać czas T i następnie\nrozpędzić układ (z dynamiką 2) do prędkości N2. Należy zmodyfikować parametr 2.2 (Zadajnik A) tak aby któryś\nz bloków PLC określał względny poziom prędkości, do której układ ma się obecnie rozpędzić (poziom ten odnosi się do\nczęstotliwości znamionowej silnika).\n          Na rys. 12.8 zaprezentowano strukturę realizującą postawione zadanie. Blok 1 jest komparatorem reagującym\nna pierwszą wartość prędkości. W prezentowanym przypadku rozpędzanie z dynamiką 1 realizowane jest do prędkości\nwynoszącej   20.0%   (ST1)   prędkości   znamionowej.   Sygnał   informujący   o   osiągnięciu   pierwszej   wartości   prędkości\nzałącza Blok 3. Blok 3 jest licznikiem zliczającym w dół od wartości 5 (ST3) z taktowaniem co 1s (czas potrzymania trwa\n5s). Sygnał wyjściowy Bloku 3 steruje Blokiem 4 i przełączaniem typu dynamiki (dynamika 1 lub dynamika 2). Blok 4 jest\nprzełącznikiem, który w zależności od sygnału na wejściu podaje do zadajnika A pierwszą lub drugą wartość prędkości\n(ST1/ST2). Wartości czasu podtrzymania (ST3), pierwszej (ST1) i drugiej (ST2) wartości prędkości można modyfikować\npodłączając w żądane miejsce np. wejście analogowe lub jeden z zadajników użytkownika. Warunkiem poprawnego\ndziałania przykładu jest zachowanie warunku: ST2 > ST1.\n\nAby zrealizować tę strukturę, należy:\n        1.Zdefiniować Blok 1 (p. 6.1 = 12, p. 6.2 = PCH.176, p. 6.3 = PCH.320, p. 6.4 = 0),\n        2.Zdefiniować Blok 2 (p. 6.5 = 23, p. 6.6 = PCH.256),\n        3.Zdefiniować Blok 3 (p. 6.9 = 27, p. 6.10 = PCH.91, p. 6.11 = PCH.257, p. 6.12 = PCH.322),\n        4.Zdefiniować Blok 4 (p. 6.13 = 9, p. 6.14 = PCH.321, p. 6.15 = PCH.320, p. 6.16 = PCH.258),\n        5.Zdefiniować Blok 5 (p. 6.17 = 23, p. 6.18 = PCH.258),\n        6.Parametr 2.2 (Zadajnik A) ustawić na PCH.259 w sposób opisany w rozdziale 3.2.1 i 3.2.8,\n        7.Parametr 1.36 (Wybór dynamiki) ustawić na PCH.260,\n        8.Włączyć PLC ustawiając parametr 5.144 na TAK.\nW powyższym przykładzie   if(n.kind==='constant'&&(!Number.isInteger(n.resource)||n.resource<0||n.resource>23))invalid();

function disconnectProjectInput(project, nodeId, key) {
 const node = project.nodes.find(item => item.id === nodeId);
 if (!node || !fields(node).some(field => field.key === key && field.type === 'pch')) return false;
 node.values[key] = 0;
 if(node.wireRoutes)delete node.wireRoutes[key];
 if(node.links)delete node.links[key];
 node.disconnected = [...new Set([...(node.disconnected || []), key])];
 return true;
}

function removeProjectNode(project, nodeId) {
 const node = project.nodes.find(item => item.id === nodeId);
 if (!node) return false;
 const removed = new Set(outputs(node));
 if (node.kind === 'block') removed.add(255 + node.slot);
 project.nodes = project.nodes.filter(item => item.id !== nodeId);
 syncReferences(project);
 for (const item of project.nodes) {
  for (const field of fields(item)) {
   if (field.type === 'pch' && (item.links?.[field.key]?.id===nodeId ||
    (!item.links?.[field.key] && !isReference(node) && removed.has(item.values[field.key])))) {
    disconnectProjectInput(project, item.id, field.key);
   }
  }
 }

}

let connectionGesture = null;
