function connectionInputAt(clientX, clientY) {
 const element = document.elementFromPoint(clientX, clientY);
 if (!element || !$('#nodes').contains(element)) return null;
 const direct = element.closest('[data-in]');
 if (direct) return direct;
 // The input row gives small connectors an accessible drop target.
 return element.closest('.portrow')?.querySelector('[data-in]') ?? null;
}
function connectionOutputAt(clientX,clientY){
 const element=document.elementFromPoint(clientX,clientY);
 if(!element||!$('#nodes').contains(element))return null;
 return element.closest('[data-out]')||element.closest('.portrow')?.querySelector('[data-out]')||null;
}

function clearConnectionGesture() {
 const gesture = connectionGesture;
 connectionGesture = null;
 $('#connection-preview')?.remove();
 $('#board').classList.remove('connecting');
 $('#board').classList.remove('connecting-to-output');
 document.querySelectorAll('.connection-target, .connection-source').forEach(port => {
  port.classList.remove('connection-target', 'connection-source');
 });
 if (gesture && $('#nodes').hasPointerCapture(gesture.pointerId)) {

 }

}

function drawConnectionPreview() {
 const gesture = connectionGesture;
 if (!gesture?.moved) return;
 let preview = $('#connection-preview');
 if (!preview) {
  preview = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  preview.id = 'connection-preview';
  preview.setAttribute('class', 'connection-preview');
  $('#wires').append(preview);
 }
 const origin = gesture.port.getBoundingClientRect();
 const board = $('#board').getBoundingClientRect();
 const target = gesture.reverse ? connectionOutputAt(gesture.clientX,gesture.clientY) : connectionInputAt(gesture.clientX, gesture.clientY);
 const end = target?.getBoundingClientRect();
 const fixedX = (origin.x + origin.width / 2 - board.x) / scale;
 const fixedY = (origin.y + origin.height / 2 - board.y) / scale;
 const movingX = ((end ? end.x + end.width / 2 : gesture.clientX) - board.x) / scale;
 const movingY = ((end ? end.y + end.height / 2 : gesture.clientY) - board.y) / scale;
 const x1=gesture.reverse?movingX:fixedX,y1=gesture.reverse?movingY:fixedY;
 const x2=gesture.reverse?fixedX:movingX,y2=gesture.reverse?fixedY:movingY;
 const bend = Math.max(65, Math.abs(x2 - x1) * .4);
 preview.setAttribute('d', `M ${x1} ${y1} C ${x1 + bend} ${y1}, ${x2 - bend} ${y2}, ${x2} ${y2}`);
 document.querySelectorAll('.connection-target').forEach(port => port.classList.remove('connection-target'));
 target?.classList.add('connection-target');
}

function centeredDiagramView(bounds,viewportWidth,viewportHeight){

 const scale=Math.max(.05,Math.min(1,(viewportWidth-48)/width,(viewportHeight-48)/height));
 const x=(bounds.left+bounds.right)*scale/2,y=(bounds.top+bounds.bottom)*scale/2;
 return {scale,marginLeft:Math.max(0,viewportWidth/2-x),marginTop:Math.max(0,viewportHeight/2-y),scrollLeft:Math.max(0,x-viewportWidth/2),scrollTop:Math.max(0,y-viewportHeight/2)};
}

 const bounds={left:Math.min(...boxes.map(r=>r.left)),right:Math.max(...boxes.map(r=>r.right)),top:Math.min(...boxes.map(r=>r.top)),bottom:Math.max(...boxes.map(r=>r.bottom))};

function referencePch(node) {
 if (node.kind === 'referenceSend') return node.disconnected?.includes('input') ? -1 : node.values.input;
 return node.pch;
}

function relatedReferenceIds(project,nodeId){
 const node=project.nodes.find(item=>item.id===nodeId);
 if(!node||!isReference(node))return [];
 if(node.kind==='referenceSend')return [node.id,...project.nodes.filter(item=>item.kind==='referenceReceive'&&item.referenceId===node.id).map(item=>item.id)];
 const sender=project.nodes.find(item=>item.id===node.referenceId&&item.kind==='referenceSend');
 return sender?[node.id,sender.id]:[node.id];
}

function connectedReferenceSenders(project) {
 return project.nodes.filter(node => node.kind === 'referenceSend' &&
  Object.hasOwn(PCH, referencePch(node)) &&
  (!node.links?.input || project.nodes.some(source => source.id === node.links.input.id)));
}

function freeReferenceSenders(project){
 return connectedReferenceSenders(project).filter(sender=>!project.nodes.some(n=>n.kind==='referenceReceive'&&n.referenceId===sender.id));
}
function referenceSignalLabel(pch){
 if(!Object.hasOwn(PCH,pch))return 'Джерело не вибрано';
 const description=pch>=256&&pch<=303?'вихід BL'+(pch-255):PCH[pch];
 return 'PCH'+pch+' ('+description+')';
}

function referencePresentation(project,node){
 const pch=referencePch(node);
 const receivers=node.kind==='referenceReceive'?[node]:project.nodes.filter(item=>item.kind==='referenceReceive'&&item.referenceId===node.id);
 const receiverIds=new Set(receivers.map(item=>item.id));
 const destinations=[];
 for(const target of project.nodes){
  if(isReference(target))continue;
  for(const field of fields(target)){
   if(field.type!=='pch'||target.disconnected?.includes(field.key)||!receiverIds.has(target.links?.[field.key]?.id))continue;
   const name=target.kind==='block'?'Вхід '+field.label+' блоку '+target.slot:field.label+' · '+(target.label||target.param);
   destinations.push(name);
  }
 }
 const active=destinations.length>0&&Object.hasOwn(PCH,pch);
 const source=referenceSignalLabel(pch);
 const destination=destinations.length?[...new Set(destinations)].join(' / '):'Вхід не під’єднано';
 return {pch,active,source,destination,name:source+' → '+destination,
  incomplete:!active&&Object.hasOwn(PCH,pch)};
}

 for(let i=1;i<anchors.length;i++){const a=anchors[i-1],b=anchors[i],d=Math.max(35,Math.abs(b[0]-a[0])*.45);curves.push([a,[a[0]+d,a[1]],[b[0]-d,b[1]],b]);}return curves;
}
function connectionPath(x1,y1,x2,y2,route){

function sampleConnectionCurve(curve){

}
function connectionCurvePoints(x1,y1,x2,y2,route){return connectionCurves(x1,y1,x2,y2,route).flatMap(sampleConnectionCurve);}
function validWireRoute(route){return !!route&&(Array.isArray(route)?route.length<=40&&route.every(p=>p&&Number.isFinite(p.x)&&Number.isFinite(p.y)):Number.isFinite(route.x)&&Number.isFinite(route.y));}

 const points=wireRoutePoints(node.wireRoutes?.[key]).map(p=>({...p}));if(points.length>=40)return false;
 const curves=connectionCurves(...geometry,points);let best=Infinity,index=0;
 curves.forEach((curve,i)=>{for(const sample of sampleConnectionCurve(curve)){const distance=Math.hypot(point.x-sample.x,point.y-sample.y);if(distance<best){best=distance;index=i;}}});

}
function curveLinesCross(a,b){
 const bounds=points=>({left:Math.min(...points.map(p=>p.x)),right:Math.max(...points.map(p=>p.x)),top:Math.min(...points.map(p=>p.y)),bottom:Math.max(...points.map(p=>p.y))});
 const ar=bounds(a),br=bounds(b);if(ar.right<br.left||br.right<ar.left||ar.bottom<br.top||br.bottom<ar.top)return false;
 const cross=(p,q,r)=>(q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x);
 for(let i=1;i<a.length;i++)for(let j=1;j<b.length;j++){
  if(Math.max(a[i-1].x,a[i].x)<Math.min(b[j-1].x,b[j].x)||Math.max(b[j-1].x,b[j].x)<Math.min(a[i-1].x,a[i].x)||Math.max(a[i-1].y,a[i].y)<Math.min(b[j-1].y,b[j].y)||Math.max(b[j-1].y,b[j].y)<Math.min(a[i-1].y,a[i].y))continue;
  const c1=cross(a[i-1],a[i],b[j-1]),c2=cross(a[i-1],a[i],b[j]),c3=cross(b[j-1],b[j],a[i-1]),c4=cross(b[j-1],b[j],a[i]);
  if(c1*c2<=.000001&&c3*c4<=.000001&&Math.max(Math.abs(c1),Math.abs(c2),Math.abs(c3),Math.abs(c4))>.001)return true;
 }return false;
}

function exampleWireScore(edge,points,edges,rects){

}
function planExampleWires(edges,rects){

 for(let pass=0;pass<3;pass++)for(const edge of ordered){
  let score=exampleWireScore(edge,edge.points,edges,rects);if(!score)continue;
  const middle=(edge.x1+edge.x2)/2,candidates=[];
  for(const offset of [120,-120,240,-240,400,-400,600,-600]){
   candidates.push({x:middle,y:Math.max(20,Math.min(2280,(edge.y1+edge.y2)/2+offset))});
   candidates.push({x:middle,y:Math.max(20,Math.min(2280,Math.min(edge.y1,edge.y2)+offset))});
  }
  for(const x of [Math.max(20,Math.min(edge.x1,edge.x2)-180),Math.min(2950,Math.max(edge.x1,edge.x2)+180)])for(const y of [Math.max(20,Math.min(edge.y1,edge.y2)-140),Math.min(2280,Math.max(edge.y1,edge.y2)+140)])candidates.push({x,y});
  for(const route of candidates){const points=connectionCurvePoints(edge.x1,edge.y1,edge.x2,edge.y2,route),next=exampleWireScore(edge,points,edges,rects);if(next<score){edge.route=route;edge.points=points;score=next;}if(!score)break;}
 }
 // Only unresolved crossings need a pair of references.
 while(true){let worst=null,score=0;for(const edge of ordered){if(edge.removed)continue;const next=exampleWireScore(edge,edge.points,edges,rects);if(next>score){worst=edge;score=next;}}if(!worst)break;worst.removed=true;}
 return edges;
}

  const a=out.getBoundingClientRect(),b=input.getBoundingClientRect();edges.push({id:n.id,key:f.key,sourceId,x1:(a.left+a.width/2-board.left)/scale,y1:(a.top+a.height/2-board.top)/scale,x2:(b.left+b.width/2-board.left)/scale,y2:(b.top+b.height/2-board.top)/scale});

 }
 for(const edge of edges){

const textTranslations=new WeakMap(),attributeTranslations=new WeakMap();
const protectedTranslationSelector='script,style,textarea,input,[data-user-text],.docpage';
function localizeElementAttributes(element){
 if(element.closest('[data-user-text],.docpage')||element.tagName==='SCRIPT'||element.tagName==='STYLE')return;
 const saved=attributeTranslations.get(element)||{};
 for(const name of ['title','aria-label','placeholder']){
  if(!element.hasAttribute(name))continue;
  const current=element.getAttribute(name),old=saved[name];const source=old&&current===old.rendered?old.source:current;
  const rendered=translatedText(source);saved[name]={source,rendered};if(current!==rendered)element.setAttribute(name,rendered);
 }
 attributeTranslations.set(element,saved);
}
function localizeTextNode(node){
 if(node.parentElement?.closest(protectedTranslationSelector))return;
 const current=node.nodeValue,old=textTranslations.get(node);const source=old&&current===old.rendered?old.source:current;
 const rendered=translatedText(source);textTranslations.set(node,{source,rendered});if(current!==rendered)node.nodeValue=rendered;

window.addEventListener('DOMContentLoaded',()=>{
 let saved='uk';try{saved=localStorage.getItem('mfc710-language')||'uk';}catch{}
 setUILanguage(['uk','en','pl'].includes(saved)?saved:'uk',{persist:false});
},{once:true});

/* Fit only at entry/restoration or explicit example load, never during editing. */
let savedEditorTheme;
try{savedEditorTheme=localStorage.getItem('mfc710-theme')||localStorage.getItem('rk-theme');}catch{}
document.documentElement.dataset.theme=['light','dark'].includes(savedEditorTheme)?savedEditorTheme:(window.matchMedia?.('(prefers-color-scheme: dark)').matches?'dark':'light');
let diagramCenterFrame=0;
function requestDiagramCenter(){
 if(diagramCenterFrame)cancelAnimationFrame(diagramCenterFrame);
 diagramCenterFrame=requestAnimationFrame(()=>{
  diagramCenterFrame=requestAnimationFrame(()=>{
   diagramCenterFrame=0;
   const viewport=$('#viewport');
   if(!viewport.clientWidth||!viewport.clientHeight)return;
   globalThis.refreshPanels?.();
   centerDiagram();
  });
 });
}
if(document.readyState==='loading')window.addEventListener('DOMContentLoaded',requestDiagramCenter,{once:true});else requestDiagramCenter();
window.addEventListener('pageshow',requestDiagramCenter);
window.addEventListener('load',requestDiagramCenter,{once:true});
if(document.fonts?.ready)document.fonts.ready.then(requestDiagramCenter);

const themeToggle=$('#theme-toggle');
function updateEditorThemeLabel(){
 const dark=document.documentElement.dataset.theme==='dark';
 const labels={uk:['Увімкнути темну тему','Увімкнути світлу тему'],en:['Switch to dark theme','Switch to light theme'],pl:['Włącz ciemny motyw','Włącz jasny motyw']};
 const label=(labels[document.documentElement.lang]||labels.uk)[dark?1:0];
 themeToggle.setAttribute('aria-pressed',String(dark));
 themeToggle.setAttribute('aria-label',label);themeToggle.title=label;
}
themeToggle.addEventListener('click',()=>{
 const theme=document.documentElement.dataset.theme==='dark'?'light':'dark';
 document.documentElement.dataset.theme=theme;
 try{localStorage.setItem('mfc710-theme',theme);}catch{}
 updateEditorThemeLabel();
});
updateEditorThemeLabel();
new MutationObserver(updateEditorThemeLabel).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
